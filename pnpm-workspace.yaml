packages:
  - "packages/*"

savePrefix: ""
autoInstallPeers: true

# Match Renovate's release-age exemption for trusted first-party packages.
minimumReleaseAgeExclude:
  - "@tryghost/*"

overrides:
  "glob@>=9.0.0 <=14.0.1": "14.0.4"
  "minimatch@>=7.0.0 <11.0.1": "11.0.8"
  trim: "^1.0.1"
  parse-link-header: "^2.0.0"
  form-data: "^4.0.6"
  "js-yaml@3": "5.5.0"

catalog:
  "@tryghost/admin-api": "1.14.16"
  "@tryghost/debug": "2.3.22"
  "@tryghost/errors": "3.4.8"
  "@tryghost/kg-default-cards": "10.3.10"
  "@tryghost/kg-html-to-lexical": "1.4.4"
  "@tryghost/pretty-cli": "3.4.4"
  "@tryghost/string": "0.3.10"
  "@types/node": "24.19.2"
  "c8": "12.0.0"
  "chalk": "6.0.1"
  "dotenv": "18.0.10"
  "escape-string-regexp": "5.0.0"
  "fast-xml-parser": "5.12.0"
  "fs-extra": "11.4.1"
  "html-entities": "2.6.0"
  "listr2": "11.4.0"
  "log-update": "8.0.0"
  "markdown-it": "15.0.3"
  "nock": "15.0.6"
  "sanitize-html": "2.18.1"
  "sharp": "0.35.5"
  "simple-dom": "1.4.0"
  "transliteration": "2.7.0"
  "typescript": "7.0.2"

allowBuilds:
  esbuild: true
  nx: true
  sharp: true
patchedDependencies:
  nx@24.0.5: patches/nx@24.0.5.patch
